# CityHelp Realtime WebSocket Service — Render deployment config
#
# Deploy to Render (free tier):
#   1. Go to https://render.com → New → Web Service
#   2. Connect your repo
#   3. Set:
#      - Name: cityhelp-realtime
#      - Environment: Bun
#      - Build Command: cd mini-services/realtime && bun install
#      - Start Command: cd mini-services/realtime && bun run start
#      - Plan: Free
#
# Or use this render.yaml:
#   render blueprint: bun x render-deploy
#
# Free tier: 512MB RAM, sleeps after 15min idle, wakes on request
# For production: upgrade to Starter ($7/mo) for always-on

services:
  - type: web
    name: cityhelp-realtime
    env: docker
    dockerfilePath: ./mini-services/realtime/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3003
      - key: NODE_ENV
        value: production
