name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Lint
        run: bun run lint

      - name: Run tests
        run: bun test tests/unit/tenant-isolation.test.ts
        env:
          DATABASE_URL: file:./test.db
          CITYHELP_MASTER_KEY: test-master-key-32-bytes-long-xxxxxxx
          CITYHELP_SESSION_SECRET: test-session-secret-32-bytes-long-xxxxxx
          NODE_ENV: test

  build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Build
        run: bun run build
        env:
          DATABASE_URL: file:./test.db
          CITYHELP_MASTER_KEY: test-master-key-32-bytes-long-xxxxxxx
          CITYHELP_SESSION_SECRET: test-session-secret-32-bytes-long-xxxxxx
